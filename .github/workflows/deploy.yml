name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  # 1. Build and validation checks
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Verify Client Build Compilation
        run: |
          cd client
          npm run build
        env:
          VITE_API_BASE_URL: "http://localhost:5000"

  # 2. Deploy to remote VPS via SSH
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Navigate to repository directory on VPS
            cd /var/www/edsphere

            # 2. Pull the latest updates from main branch
            git fetch --all
            git reset --hard origin/main

            # 3. Inject production environmental variables securely
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

            # 4. Rebuild and restart docker containers in detached background mode
            docker compose down
            docker compose up --build -d

            # 5. Clean up stale/dangling images to free up VPS disk space
            docker image prune -f
