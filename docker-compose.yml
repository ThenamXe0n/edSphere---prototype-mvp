version: '3.8'

services:
  # 1. MongoDB Database Service
  database:
    image: mongo:6.0-jammy
    container_name: edusphere_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD:-SecretPassword123!}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # 2. Node/Express Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edusphere_server
    restart: always
    depends_on:
      - database
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # Connect to the MongoDB service container name
      MONGODB_URI: mongodb://${MONGO_DB_USER:-admin}:${MONGO_DB_PASSWORD:-SecretPassword123!}@database:27017/edusphere?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@edusphere.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-SuperAdmin123!}
    volumes:
      # Persistent storage volume for uploads (profile images, course thumbnails)
      - uploads_data:/app/public/uploads

  # 3. Nginx React Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: edusphere_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongodb_data:
  uploads_data:
